services:
  - type: web
    name: resume-ai-helper
    runtime: python
    rootDir: backend
    buildCommand: apt-get install -y python3-cffi python3-brotli libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0 libcairo2 libffi-dev shared-mime-info && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
